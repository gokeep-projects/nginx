name: Build nginx (static, musl)

# Builds fully static nginx binaries with musl libc for
#   x86_64, aarch64, loongarch64, mips, mips64, mips64el (all musl)
# and, if an external toolchain is configured, sw_64 (glibc).
#
# The musl cross toolchains are taken from
#   https://github.com/cross-tools/musl-cross/releases
# pcre2, zlib and OpenSSL are built from source and linked statically.

on:
  workflow_dispatch:
    inputs:
      openssl:
        description: 'Bundle a static OpenSSL (TLS/HTTP2 support)'
        type: boolean
        default: true
      publish_release:
        description: 'Attach the artifacts to a GitHub Release'
        type: boolean
        default: false
      tag:
        description: 'Release tag (empty: nginx-<version>)'
        type: string
        default: ''
      # sw_64 has no public musl port and no upstream gcc/glibc support, so it
      # needs an external (Sunway) cross toolchain.  These inputs override the
      # repository variables of the same name for a single run.
      sw64_toolchain_url:
        description: 'sw_64 cross toolchain tarball URL (enables the sw_64 build)'
        type: string
        default: ''
      sw64_toolchain_prefix:
        description: 'sw_64 toolchain prefix, e.g. sw_64-linux-gnu-'
        type: string
        default: ''
      sw64_target_triple:
        description: 'sw_64 target triple (empty: ask gcc -dumpmachine)'
        type: string
        default: ''
  push:
    branches:
      - master
      - main
      - 'nginx-*'
    tags:
      - 'nginx-*'
      - 'v*'

permissions:
  contents: write

env:
  # https://github.com/cross-tools/musl-cross/releases
  MUSL_CROSS_RELEASE: '20261001'

  PCRE2_VERSION: '10.49'
  ZLIB_VERSION: '1.3.2'
  OPENSSL_VERSION: '3.5.9'

jobs:
  build:
    name: nginx ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: x86_64
            triple: x86_64-unknown-linux-musl
            openssl_target: linux-x86_64
            qemu: ''
            runnable: '1'
            patch_run_tests: '0'
          - arch: aarch64
            machine: aarch64
            triple: aarch64-unknown-linux-musl
            openssl_target: linux-aarch64
            qemu: aarch64
            runnable: '1'
            patch_run_tests: '0'
          # qemu-user has no big endian mips and no loongarch64 in the binfmt
          # image used by setup-qemu-action, so these two are configured
          # without running the test programs (see PATCH_RUN_TESTS).
          - arch: loongarch64
            machine: loongarch64
            triple: loongarch64-unknown-linux-musl
            openssl_target: linux64-loongarch64
            qemu: ''
            runnable: '0'
            patch_run_tests: '1'
            force_endian: little
          - arch: mips
            machine: mips
            triple: mips-unknown-linux-musl
            openssl_target: linux-mips32
            qemu: ''
            runnable: '0'
            patch_run_tests: '1'
            force_endian: big
            # o32, ILP32
            sizeof_long: '4'
            sizeof_pointer: '4'
            sizeof_size_t: '4'
          # 64 bit MIPS, n64 ABI (LP64)
          - arch: mips64
            machine: mips64
            triple: mips64-unknown-linux-musl
            openssl_target: linux64-mips64
            qemu: ''
            runnable: '0'
            patch_run_tests: '1'
            force_endian: big
          # OpenSSL has no linux64-mips64el target: little endian is the
          # L_ENDIAN define, and the MIPS assembler is left out because its
          # byte order handling cannot be checked on this host.
          - arch: mips64el
            machine: mips64el
            triple: mips64el-unknown-linux-musl
            openssl_target: linux64-mips64
            extra_openssl_opt: '-DL_ENDIAN no-asm'
            qemu: ''
            runnable: '0'
            patch_run_tests: '1'
            force_endian: little

    steps:
      - uses: actions/checkout@v4

      - name: Resolve nginx version
        id: version
        run: |
          version=$(sed -n 's/^#define NGINX_VERSION  *"\(.*\)"/\1/p' src/core/nginx.h)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "NGINX_VERSION=$version" >> "$GITHUB_ENV"

      # nginx's configure runs small test programs; qemu-user lets us run the
      # cross-compiled (statically linked) ones so that feature detection,
      # byte order and sizeof() are determined correctly.
      - name: Set up QEMU
        if: matrix.qemu != ''
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu }}

      - name: Cache toolchain and dependency downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nginx-musl/dl
          key: nginx-musl-dl-${{ matrix.arch }}-${{ env.MUSL_CROSS_RELEASE }}-${{ env.PCRE2_VERSION }}-${{ env.ZLIB_VERSION }}-${{ env.OPENSSL_VERSION }}

      - name: Install ${{ matrix.arch }} musl toolchain
        run: |
          set -euo pipefail

          dl="$RUNNER_TEMP/nginx-musl/dl"
          tc="$RUNNER_TEMP/toolchain-${{ matrix.arch }}"
          mkdir -p "$dl" "$tc"

          tarball="$dl/${{ matrix.triple }}.tar.xz"

          if [ ! -s "$tarball" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              -o "$tarball.part" \
              "https://github.com/cross-tools/musl-cross/releases/download/${MUSL_CROSS_RELEASE}/${{ matrix.triple }}.tar.xz"
            mv "$tarball.part" "$tarball"
          fi

          tar -xf "$tarball" -C "$tc"

          gcc=$(find "$tc" -maxdepth 5 \( -type f -o -type l \) -name '${{ matrix.triple }}-gcc' | head -n 1)
          test -n "$gcc"
          dirname "$gcc" >> "$GITHUB_PATH"
          "$gcc" --version | head -n 1

      - name: Build nginx
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
          CROSS: ${{ matrix.triple }}-
          TRIPLE: ${{ matrix.triple }}
          OPENSSL_TARGET: ${{ matrix.openssl_target }}
          EXTRA_OPENSSL_OPT: ${{ matrix.extra_openssl_opt || '' }}
          RUNNABLE: ${{ matrix.runnable }}
          PATCH_RUN_TESTS: ${{ matrix.patch_run_tests }}
          FORCE_ENDIAN: ${{ matrix.force_endian || '' }}
          SIZEOF_LONG: ${{ matrix.sizeof_long || '' }}
          SIZEOF_POINTER: ${{ matrix.sizeof_pointer || '' }}
          SIZEOF_SIZE_T: ${{ matrix.sizeof_size_t || '' }}
          # '1' on tag pushes, otherwise the workflow_dispatch input
          WITH_OPENSSL: ${{ (github.event_name != 'workflow_dispatch' || inputs.openssl) && '1' || '0' }}
        shell: bash
        run: |
          bash .github/scripts/build-nginx-musl.sh 2>&1 | tee build.log

      # keeps the failure readable in the run page without signing in
      - name: Diagnostics
        if: failure()
        run: |
          {
            echo "### nginx ${{ matrix.arch }} build failed"
            echo
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # annotations are visible in the run page HTML, the log is not
          { grep -iE 'error|fatal|cannot|not found|undefined' build.log | tail -n 6
            tail -n 6 build.log
          } 2>/dev/null | awk '!seen[$0]++' | cut -c1-250 | tail -n 8 |
          while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ env.NGINX_VERSION }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # musl has no upstream sw_64 port and QEMU cannot emulate sw_64, so this
  # target needs an externally supplied toolchain, e.g. Sunway's:
  #
  #   repository variables:
  #     SW64_TOOLCHAIN_URL     tarball with the cross toolchain
  #     SW64_TOOLCHAIN_PREFIX  sw_64-sunway-linux-gnu-
  #     SW64_TARGET_TRIPLE     sw_64-linux-gnu          (optional)
  #     SW64_LIBC              gnu (musl has no sw_64 port; optional)
  #
  # Without SW64_TOOLCHAIN_URL the job is skipped.
  build-sw64:
    name: nginx sw_64 (external toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: vars.SW64_TOOLCHAIN_URL != '' || inputs.sw64_toolchain_url != ''
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve nginx version
        id: version
        run: |
          version=$(sed -n 's/^#define NGINX_VERSION  *"\(.*\)"/\1/p' src/core/nginx.h)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "NGINX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install sw_64 toolchain
        env:
          TOOLCHAIN_URL: ${{ inputs.sw64_toolchain_url || vars.SW64_TOOLCHAIN_URL }}
          TOOLCHAIN_PREFIX: ${{ inputs.sw64_toolchain_prefix || vars.SW64_TOOLCHAIN_PREFIX }}
        run: |
          set -euo pipefail

          dl="$RUNNER_TEMP/nginx-musl/dl"
          tc="$RUNNER_TEMP/toolchain-sw_64"
          mkdir -p "$dl" "$tc"

          tarball="$dl/sw_64-toolchain.tar"

          if [ ! -s "$tarball" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              -o "$tarball.part" "$TOOLCHAIN_URL"
            mv "$tarball.part" "$tarball"
          fi

          tar -xf "$tarball" -C "$tc"

          gcc=$(find "$tc" -maxdepth 6 \( -type f -o -type l \) -name "${TOOLCHAIN_PREFIX}gcc" | head -n 1)
          test -n "$gcc"
          dirname "$gcc" >> "$GITHUB_PATH"
          "$gcc" --version | head -n 1

      - name: Build nginx
        env:
          ARCH: sw_64
          MACHINE: sw_64
          CROSS: ${{ inputs.sw64_toolchain_prefix || vars.SW64_TOOLCHAIN_PREFIX }}
          TRIPLE: ${{ inputs.sw64_target_triple || vars.SW64_TARGET_TRIPLE }}
          # musl has no sw_64 port, so the external toolchain is glibc based
          # unless the variable says otherwise
          LIBC: ${{ vars.SW64_LIBC || 'gnu' }}
          # no QEMU for sw_64, and no OpenSSL target for it either
          RUNNABLE: '0'
          PATCH_RUN_TESTS: '1'
          FORCE_ENDIAN: little
          WITH_OPENSSL: '0'
        shell: bash
        run: |
          bash .github/scripts/build-nginx-musl.sh 2>&1 | tee build.log

      - name: Diagnostics
        if: failure()
        run: |
          {
            echo "### nginx sw_64 build failed"
            echo
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          { grep -iE 'error|fatal|cannot|not found|undefined' build.log | tail -n 6
            tail -n 6 build.log
          } 2>/dev/null | awk '!seen[$0]++' | cut -c1-250 | tail -n 8 |
          while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ env.NGINX_VERSION }}-sw_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-sw64]
    # the sw_64 job is skipped unless a toolchain is configured, so a skip
    # must not block the release
    if: |
      !cancelled() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      # keep exactly one format in the release: drop assets that are not a
      # tar.gz package or its checksum (older runs shipped bare binaries)
      - name: Remove stale assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('nginx-{0}', needs.build.outputs.version) }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          rel=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     "$api/releases/tags/$TAG") || exit 0
          printf '%s' "$rel" |
            jq -r '.assets[] | select(.name | test("\\.tar\\.gz") | not) | .id' |
            while read -r id; do
              [ -n "$id" ] || continue
              echo "removing stale asset $id"
              curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                   "$api/releases/assets/$id"
            done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('nginx-{0}', needs.build.outputs.version) }}
          name: nginx ${{ needs.build.outputs.version }} (static)
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Statically linked nginx ${{ needs.build.outputs.version }} binaries, one file per target.

            | target | libc | notes |
            | --- | --- | --- |
            | x86_64 | musl | static |
            | aarch64 | musl | static |
            | loongarch64 | musl | static |
            | mips (o32, big endian) | musl | static |
            | mips64 (n64, big endian) | musl | static |
            | mips64el (n64, little endian) | musl | static |
            | sw_64 | glibc | built when a Sunway cross toolchain is configured (`SW64_TOOLCHAIN_URL`) |

            Every asset is a `.tar.gz` holding exactly one file, the statically
            linked `nginx` binary (plus a separate `.sha256`):

            ```sh
            tar -xzf nginx-${{ needs.build.outputs.version }}-x86_64-linux-musl-static.tar.gz
            ./nginx-${{ needs.build.outputs.version }}-x86_64-linux-musl-static -V
            ```
